<!DOCTYPE html>
<html lang="sr">
<head>
    <meta charset="UTF-8">
    <title>AI Kviz Avantura</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #121212; color: #ffffff; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .game-box { background-color: #1e1e1e; padding: 30px; border-radius: 12px; box-shadow: 0 8px 24px rgba(0,0,0,0.5); width: 100%; max-width: 500px; text-align: center; }
        h1 { color: #4da6ff; margin-top: 0; }
        .ai-box { background-color: #2a2a2a; padding: 20px; border-radius: 8px; min-height: 80px; margin-bottom: 20px; font-size: 18px; line-height: 1.5; border-left: 4px solid #4da6ff; text-align: left; }
        input[type="text"], input[type="password"] { width: 90%; padding: 12px; margin-bottom: 15px; border: 1px solid #444; border-radius: 6px; background-color: #333; color: white; font-size: 16px; }
        button { background-color: #4da6ff; color: #121212; border: none; padding: 12px 24px; font-size: 16px; font-weight: bold; border-radius: 6px; cursor: pointer; transition: 0.2s; }
        button:hover { background-color: #3385ff; }
        button:disabled { background-color: #555; cursor: not-allowed; }
    </style>
</head>
<body>

<div class="game-box">
    <h1>AI Kviz Majstor</h1>
    
    <!-- Polje za unos API ključa -->
    <div id="setup-screen">
        <p>Unesi svoj besplatni Gemini API ključ da započneš igru:</p>
        <input type="password" id="api-key" placeholder="Nalepi API ključ ovde...">
        <br>
        <button onclick="startGame()">Započni igru</button>
    </div>

    <!-- Glavni ekran igrice -->
    <div id="game-screen" style="display: none;">
        <!-- Polje gde AI postavlja pitanja -->
        <div class="ai-box" id="ai-output">Učitavanje prvog pitanja...</div>
        
        <!-- Polje gde igrač upisuje odgovor -->
        <input type="text" id="player-input" placeholder="Upiši svoj odgovor ovde..." onkeypress="if(event.key === 'Enter') sendAnswer()">
        <br>
        <button id="send-btn" onclick="sendAnswer()">Pošalji odgovor</button>
    </div>
</div>

<script>
    let apiKey = '';
    let chatHistory = []; // Pamti tok igre da bih znao šta sam te već pitao

    // Sistemska instrukcija koja mi daje ulogu u igrici
    const systemPrompt = "Ti si voditelj zabavnog i dinamičnog kviza znanja na srpskom jeziku. Tvoj zadatak je da igraču postavljaš po jedno pitanje iz opšte kulture, nauke ili istorije. Kada ti igrač pošalje odgovor, prvo kratko i duhovito reci da li je odgovor tačan (i daj tačan odgovor ako je pogrešio), dodaj 1 bod ako je tačno, a zatim odmah u istoj poruci postavi sledeće pitanje. Budi kratak i koncizan.";

    async function startGame() {
        apiKey = document.getElementById('api-key').value.trim();
        if (!apiKey) {
            alert("Moraš uneti API ključ!");
            return;
        }
        document.getElementById('setup-screen').style.display = 'none';
        document.getElementById('game-screen').style.display = 'block';

        // Inicijalizujemo igru prvom porukom
        await communicateWithAI("Zdravo! Spreman sam za igru. Postavi mi prvo pitanje.");
    }

    async function sendAnswer() {
        const inputField = document.getElementById('player-input');
        const userText = inputField.value.trim();
        if (!userText) return;

        inputField.value = '';
        await communicateWithAI(userText);
    }

    async function communicateWithAI(messageText) {
        const outputBox = document.getElementById('ai-output');
        const sendBtn = document.getElementById('send-btn');
        
        outputBox.innerText = "AI razmišlja...";
        sendBtn.disabled = true;

        // Dodajemo poruku igrača u istoriju razgovora
        chatHistory.push({
            role: "user",
            parts: [{ text: messageText }]
        });

        try {
            // Slanje zahteva Gemini modelu
            const response = await fetch(`https://googleapis.com{apiKey}`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    system_instruction: { parts: [{ text: systemPrompt }] },
                    contents: chatHistory
                })
            });

            const data = await response.json();
            
            if (data.error) {
                outputBox.innerText = "Greška: " + data.error.message;
                sendBtn.disabled = false;
                return;
            }

            // Preuzimanje mog odgovora
            const aiReply = data.candidates[0].content.parts[0].text;
            
            // Čuvanje mog odgovora u istoriju da bih pamtio kontekst
            chatHistory.push({
                role: "model",
                parts: [{ text: aiReply }]
            });

            // Prikaz novog pitanja igraču
            outputBox.innerText = aiReply;
        } catch (error) {
            outputBox.innerText = "Došlo je do greške u komunikaciji sa serverom.";
        }

        sendBtn.disabled = false;
        document.getElementById('player-input').focus();
    }
</script>

</body>
</html>
